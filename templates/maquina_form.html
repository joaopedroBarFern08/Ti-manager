{% extends "base.html" %}

{% block title %}
Nova Máquina - TI Manager
{% endblock %}

{% block page_title %}
Nova Máquina
{% endblock %}

{% block header_actions %}
<a
    href="{{ proximo or url_for('maquinas.maquinas') }}"
    class="btn btn-secondary"
>
    Voltar
</a>
{% endblock %}

{% block content %}

<form method="POST" class="form">

    {% if proximo %}

        <input type="hidden" name="proximo" value="{{ proximo }}">

    {% endif %}

    <div class="form-group">

        <label for="patrimonio">
            Patrimônio
        </label>

        <input
            type="text"
            id="patrimonio"
            name="patrimonio"
            placeholder="Ex: 025618"
            required
        >

    </div>


    <div class="form-group">

        <label for="empresa">
            Empresa
        </label>

        <input
            type="text"
            id="empresa"
            name="empresa"
            placeholder="Ex: EMP"
            maxlength="20"
            required
        >

    </div>

    <div class="form-group">
        <label for="status_maquina">Status</label>
        <select id="status_maquina" name="status_maquina">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Em estoque">Em estoque</option>
        </select>
    </div>


    <div class="form-group">

        <label for="tipo">
            Tipo
        </label>

        <select
            id="tipo"
            name="tipo"
            required
        >

            <option value="">
                Selecione...
            </option>

            <option value="notebook">
                Notebook
            </option>

            <option value="desktop">
                Desktop
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="modelo">
            Modelo
        </label>

        <input
            type="text"
            id="modelo"
            name="modelo"
            placeholder="Ex: Dell Latitude 3420"
            required
        >

    </div>


    <div class="form-group">

        <label for="usuario">
            Usuário
        </label>

        <input
            type="text"
            id="usuario"
            name="usuario"
        >

    </div>


    <div class="form-group">

        <label for="setor">
            Setor
        </label>

        <input
            type="text"
            id="setor"
            name="setor"
        >

    </div>

    <div class="form-group">

        <label for="observacao">Observação</label>

        <textarea
            id="observacao"
            name="observacao"
            rows="4"
            placeholder="Informações adicionais sobre a máquina"
        ></textarea>

    </div>


    <button
        type="submit"
        class="btn"
    >
        Cadastrar máquina
    </button>

</form>

<script id="patrimonios-maquinas" type="application/json">{{ patrimonios|tojson }}</script>

{% endblock %}
