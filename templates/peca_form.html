{% extends "base.html" %}

{% block title %}
Nova Peça - TI Manager
{% endblock %}

{% block page_title %}
Nova Peça
{% endblock %}

{% block content %}

<form
    method="POST"
    class="form"
>

    <div class="form-group">

        <label for="nome">
            Nome da peça
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="off"
            required
        >

        <div
            id="sugestoes-pecas"
            class="sugestoes-pecas"
        ></div>

    </div>

    <input
        type="hidden"
        id="peca_id"
        name="peca_id"
    >

    <div class="form-group">

        <label for="categoria">
            Categoria
        </label>

        <input
            type="text"
            id="categoria"
            name="categoria"
        >

    </div>


    <div class="form-group">

        <label for="quantidade">
            Estoque atual
        </label>

        <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="0"
            required
        >

    </div>


    <div class="form-group">

        <label for="estoque_minimo">
            Estoque mínimo
        </label>

        <input
            type="number"
            id="estoque_minimo"
            name="estoque_minimo"
            min="0"
            value="1"
            required
        >

    </div>


    <button
        type="submit"
        class="btn"
    >
        Cadastrar peça
    </button>

</form>

{% endblock %}
